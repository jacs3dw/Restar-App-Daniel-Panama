<ion-header [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 0 15px;padding-top: 20px;--border-width: 0;">
    <ion-buttons slot="start">
      <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);"></ion-icon>
    </ion-buttons>
    <ion-title class="r14" style="text-align: center;">Delivery History</ion-title>
  </ion-toolbar>

  <!-- Chips de filtro (All / Completed / Pending) -->
  <div class="scroll list" style="margin: 8px 15px;">
    <div
      *ngFor="let item of items; let i = index;"
      (click)="onFocus(i)"
      [ngStyle]="{
        'background-color': item.focused ? 'var(--ion-color-txt)' : 'var(--ion-color-search)',
        'border': 'none',
        'margin-right': '7px',
        'border-radius': '12px',
        'padding': '0 20px'
      }"
      style="height: 48px;justify-content: center;align-items: center;display: flex;"
    >
      <ion-text
        [style.color]="item.focused ? 'var(--ion-color-bg)' : 'var(--ion-color-txt)'"
        class="m16"
      >
        {{ item.label }}
      </ion-text>
    </div>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- 🔹 LISTA DINÁMICA de DELIVERIES con el mismo diseño de SHIPMENTS -->
  <div
    class="box shadow"
    *ngFor="let delivery of filteredDeliveries; let last = last"
    [style.margin-top.px]="15"
    [style.margin-bottom.px]="last ? 80 : 0"
    style="background-color: var(--ion-color-bg1); border-radius: 12px; padding: 16px;"
    (click)="goToTrackOrder(delivery)"  
  >


    <!-- 🔸 Fila "Title:" + icono según estado + título + botón "I want to delete" -->
    <div class="list" style="align-items: flex-start; margin-top: 8px;">
      <div style="flex: 1;">
        <!-- Línea "Title:" con icono a la derecha -->
        <div style="display: flex; align-items: center; gap: 6px;">
          <ion-text
            class="b16"
            style="color: rgba(110, 110, 110, 0.60); display: block; margin-bottom: 4px;"
          >
            Title:
          </ion-text>

          <!-- Si está Pending, mostrar warning.svg, si no check verde -->
          <img
            *ngIf="delivery.status === 'Pending'; else okIcon"
            src="../../../../assets/icon/warning.svg"
            alt="Warning"
            style="width: 16px; height: 16px;"
          />
          <ng-template #okIcon>
            <ion-icon
              name="checkmark-circle"
              style="font-size: 16px; color: #4CAF50;"
            ></ion-icon>
          </ng-template>
        </div>

        <!-- Título + botón "I want to delete" + línea inferior -->
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 4px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
          "
        >
          <!-- Título dinámico -->
          <ion-text class="b16" style="color: var(--ion-color-txt); flex: 1;">
            {{ delivery.title }}
          </ion-text>

          <!-- Botón 'I want to delete' -->
          <div style="margin-top: 10px; display: flex; justify-content: flex-end;">
            <!-- Chip de estado con color dinámico -->
            <div
              class="chip1"
              [ngStyle]="{
                'background-color': delivery.statusColor || 'var(--ion-color-primary)'
              }"
            >
              <ion-text class="r10" style="color: #fff;">
                {{ delivery.status }}
              </ion-text>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 🔸 URL + descripción -->
    <div>
      <!-- URL -->
      <div style="margin-top: 8px; margin-bottom: 8px;">
        <ion-text
          class="r12"
          style="
            color: #488EEB;
            cursor: pointer;
            word-break: break-all;
          "
          (click)="openDeliveryUrl($event, delivery.url)"
        >
          {{ delivery.url }}
        </ion-text>
      </div>

      <!-- Descripción -->
      <div style="margin-bottom: 12px;">
        <ion-text class="r12" style="color: var(--ion-color-dis); line-height: 1.4;">
          {{ delivery.description }}
        </ion-text>
      </div>
    </div>



  </div>
</ion-content>
