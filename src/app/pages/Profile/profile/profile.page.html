<ion-header [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 0px 15px;padding-top: 8px;--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/tabs/home">
      <ion-icon name="arrow-back-outline" style="font-size: 24px;" color="txt"></ion-icon>
    </ion-buttons>
    <div class="ion-text-center" >
      <ion-text class="r14">My Profile </ion-text>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" color="bg">

  <div class="list" style="justify-content: center;">
    <ion-img src="../../../../assets/image/d5.png" style="height: 104px;width: 104px;"></ion-img>
    <div style="position: absolute;left: 53%;margin-top: 72px;">
      <ion-img src="../../../../assets/image/d6.png" style="height: 24px;width: 24px;"></ion-img>
    </div>
  </div>

  <div class="list" style="margin-top: 30px;">
    <ion-text class="r16" style="color: var(--ion-color-dis);flex: 0.5;">Name</ion-text>
    <div class="input" style="flex: 1;">
      <ion-input placeholder="ferdous" style="flex: 1;"/>
    </div>
  </div>

  <div class="list" style="margin-top: 20px;">
    <ion-text class="r16" style="color: var(--ion-color-dis);flex: 0.5;">Phone</ion-text>
    <div class="input" style="flex: 1;">
      <ion-input placeholder="+880-51248 984" style="flex: 1;"/>
    </div>
  </div>

  <div class="list" style="margin-top: 20px;">
    <ion-text class="r16" style="color: var(--ion-color-dis);flex: 0.5;">Email</ion-text>
    <div class="input" style="flex: 1;">
      <ion-input placeholder="ferdous@gmail.com" style="flex: 1;"/>
    </div>
  </div>

  <div class="list" style="margin-top: 20px;">
    <ion-text class="r16" style="color: var(--ion-color-dis);flex: 0.5;">Country</ion-text>
    <div class="input" style="flex: 1;">
      <ion-input placeholder="Panama" style="flex: 1;"/>
    </div>
  </div>

</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 15px 5px;--border-width: 0 0;">
    
    <ion-button routerLink="/tabs/home" expand="block" style="margin-bottom: 5px;--background: var(--ion-color-txt);--color:var(--ion-color-bg)">Submit Changes</ion-button>

  </ion-toolbar>
</ion-footer>
