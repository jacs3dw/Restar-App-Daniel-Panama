<ion-header [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 0px 15px;padding-top: 8px;--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/tabs/menu">
      <ion-icon name="arrow-back-outline" style="font-size: 24px;" color="txt"></ion-icon>
    </ion-buttons>
    <div class="ion-text-center" >
      <ion-text class="r14">Help</ion-text>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" color="bg">

  <div class="list">
    <div class="input2" style="flex: 1;">
      <ion-input type="text" placeholder="Name" style="flex:1"></ion-input>
    </div>
    <div class="input2" style="margin-left: 15px;flex:1" >
      <ion-input type="text" placeholder="Email/Phone" style="flex:1"></ion-input>
    </div>
  </div>
  
  <div class="input2" style="margin-top: 20px;height: 180px;align-items: flex-start;">
    <ion-textarea type="text" placeholder="Subject..." style="flex:1"></ion-textarea>
  </div>

  <div class="list" style="align-items: flex-start;margin-top: 15px;">
    <ion-img src="../../../../assets/image/a8.png" style="height: 20px;width: 20[x];"></ion-img>
    <ion-text class="r14" style="margin-left: 10px;">After submit question you will notify very soon.</ion-text>
  </div>

</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 15px 5px;--border-width: 0 0;">
    
    <ion-button routerLink="/tabs/menu" expand="block" style="margin-bottom: 5px;--background: var(--ion-color-txt);--color:var(--ion-color-bg)">Submit Question</ion-button>

  </ion-toolbar>
</ion-footer>
