<ion-header [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 0 15px;padding-top: 20px;--border-width: 0;">
    <ion-buttons slot="start" routerLink="/tabs/history">
      <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
    </ion-buttons>
    <ion-title class="r14" style="text-align: center;">Services</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <div routerLink="/trackorder" class="box list shadow" style="background-color: var(--ion-color-bg1);">
    <ion-img src="../../../../assets/image/a1.png" style="height:24px;width:24px;" />
    <ion-text class="m16" style="margin-left: 10px;flex: 1;">Track Order</ion-text>
  </div>

  <div routerLink="/cparcel" class="box list shadow" style="margin-top: 15px;background-color: var(--ion-color-bg1);">
    <ion-img src="../../../../assets/image/a2.png" style="height:24px;width:24px;" />
    <ion-text class="m16" style="margin-left: 10px;flex: 1;">Calculate Parcel</ion-text>
  </div>

  <div routerLink="/ssp" class="box list shadow" style="margin-top: 15px;background-color: var(--ion-color-bg1);">
    <ion-img src="../../../../assets/image/a3.png" style="height:24px;width:24px;" />
    <ion-text class="m16" style="margin-left: 10px;flex: 1;">Ship Parcel</ion-text>
  </div>

  <div routerLink="/snc" class="box list shadow" style="margin-top: 15px;margin-bottom: 15px;background-color: var(--ion-color-bg1);">
    <ion-img src="../../../../assets/image/a4.png" style="height:24px;width:24px;" />
    <ion-text class="m16" style="margin-left: 10px;flex: 1;">Nearby Courier</ion-text>
  </div>
</ion-content>
