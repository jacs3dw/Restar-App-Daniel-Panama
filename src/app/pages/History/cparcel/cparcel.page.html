<ion-header [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 0 15px;padding-top: 20px;--border-width: 0;">
    <ion-buttons slot="start" routerLink="/services">
      <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
    </ion-buttons>
    <ion-title class="r14" style="text-align: center;">Calculate Parcel</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <div class="list" style="margin-bottom: 15px;">
    <div>
      <div class="icon" style="height: 16px;width: 16px;background-color:#F95A5420;">
        <div class="icon" style="height: 4px;width: 4px;background-color: var(--ion-color-primary);"></div>
      </div>
      <div style="border: 1px solid #F95A5420;height: 40px;width: 1px;margin-left: 7px;"></div>
      <div class="icon" style="height: 16px;width: 16px;background-color:#F95A5420;">
        <ion-icon name="location-outline" style="font-size: 8px;color: var(--ion-color-primary);" />
      </div>
    </div>
    <div style="margin-left: 15px;flex: 1;">
      <div class="input2 shadow" style="background-color: var(--ion-color-bg1);height: 48px;">
        <ion-text class="r12" style="color: var(--ion-color-dis);">From</ion-text>
        <ion-input placeholder="Gouripur, Daudkandi" style="margin-left: 10px;flex: 1;"/>
      </div>
      <div class="input2 shadow" style="background-color: var(--ion-color-bg1);height: 48px;margin-top: 15px;">
        <ion-text class="r12" style="color: var(--ion-color-dis);">To</ion-text>
        <ion-input placeholder="Tejgaon, Dhaka" style="margin-left: 15px;flex: 1;"/>
      </div>
    </div>
  </div>

  <div class="list1" style="margin-top: 15px;">
    <ion-text class="subtitle">Package Size</ion-text>
    <div class="icon" style="height: 36px;width: 36px;border-radius: 10px;">
      <ion-icon name="scan" style="font-size: 18px;color: var(--ion-color-bg);"/>
    </div>
  </div>

  <div class="scroll list" style="margin-top: 15px;">
    <div>
      <div class="box shadow" style="width: 215px;margin: 5px;margin-bottom: 15px;background-color: var(--ion-color-bg1);">
        <div class="list1">
          <ion-text class="b16">Small</ion-text>
          <ion-text class="b16">$ <ion-text class="apptitle" style="color: var(--ion-color-primary);"> 8.00</ion-text></ion-text>
        </div>
        <div class="column" style="align-items: center;margin-top: 20px;">
          <ion-img src="../../../../assets/image/s6.png" style="height:91px;width:95px;" />
        </div>
        <div class="list" style="margin-top: 20px;">
          <div style="flex: 1;">
            <ion-text class="r14" style="color: var(--ion-color-dis);">Max. Weight</ion-text>
            <div>
              <ion-text class="b16">0-5 kg</ion-text>
            </div>
          </div>
          <div style="flex: 1;">
            <ion-text class="r14" style="color: var(--ion-color-dis);">Max. Length</ion-text>
            <div>
              <ion-text class="b16">33 cm</ion-text>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="box shadow" style="width: 215px;margin: 5px;margin-left: 10px;margin-bottom: 15px;background-color: var(--ion-color-bg1);">
        <div class="list1">
          <ion-text class="b16">Small</ion-text>
          <ion-text class="b16">$ <ion-text class="apptitle" style="color: var(--ion-color-primary);"> 8.00</ion-text></ion-text>
        </div>
        <div class="column" style="align-items: center;margin-top: 20px;">
          <ion-img src="../../../../assets/image/s6.png" style="height:91px;width:95px;" />
        </div>
        <div class="list" style="margin-top: 20px;">
          <div style="flex: 1;">
            <ion-text class="r14" style="color: var(--ion-color-dis);">Max. Weight</ion-text>
            <div>
              <ion-text class="b16">5-9 kg</ion-text>
            </div>
          </div>
          <div style="flex: 1;">
            <ion-text class="r14" style="color: var(--ion-color-dis);">Max. Length</ion-text>
            <div>
              <ion-text class="b16">33 cm</ion-text>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="list2" style="margin-top: 10px;">
    <ion-img src="../../../../assets/image/s7.png" style="height:20px;width:20px;" />
    <ion-text class="r14" style="margin-left: 10px;flex: 1;">Calculate shipping cost base on order
      value or size of item</ion-text>
  </div>

  <div routerLink="/cp1" class="btno" style="margin: 20px 0;">
    <ion-text class="b14">Calculate</ion-text>
  </div>

</ion-content>
