<ion-header [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 0px 15px;padding-top: 8px;--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/cp4">
      <ion-icon name="arrow-back-outline" style="font-size: 24px;" color="txt"></ion-icon>
    </ion-buttons>
    <div class="ion-text-center" >
      <ion-text class="r14">Payment</ion-text>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" color="bg">

  <div style="margin-top: -10px;">
    <ion-text class="subtitle">Promo code</ion-text>
  </div> 

  <div class="list" style="margin-top: 15px;">
    <ion-img src="../../../../assets/image/a19.png" style="height: 33px;width: 33px;"></ion-img>
    <div style="flex:1;margin-left: 15px;">
      <ion-text class="b16">Yah! You Saved<ion-text class="b16" style="color: var(--ion-color-primary);"> $7.95 </ion-text></ion-text>
      <div style="margin-top: 2px;">
        <ion-text class="r14" style="color: var(--ion-color-dis);">Cuppon Applied</ion-text>
      </div>
    </div>
    <div class="icon" style="height: 36px;width: 36px;border-radius: 10px;background-color: var(--ion-color-bg1);">
      <ion-icon name="close-circle-outline" style="font-size: 18px;" color="txt"></ion-icon>
    </div>
  </div>

  <div style="margin-top: 30px;">
    <ion-text class="subtitle">Order Summary</ion-text>
  </div> 

  <div class="list1" style="margin-top: 20px;">
    <ion-text class="r14" >Order Amount</ion-text>
    <ion-text class="b16">$48.00</ion-text>
  </div>

  <div class="list1" style="margin-top: 20px;">
    <ion-text class="r14" >Home Delivery</ion-text>
    <ion-text class="b16">$5.00</ion-text>
  </div>

  <div class="list1" style="margin-top: 20px;">
    <ion-text class="r14" >Cuppon Discount</ion-text>
    <ion-text class="b16">-$7.95</ion-text>
  </div>

  <div class="lines" style="border-color: var(--ion-color-input);margin: 20px 0px;"></div>

  <div class="list1" style="margin-top: 20px;">
    <ion-text class="r14" >Total</ion-text>
    <ion-text class="b16" style="color: var(--ion-color-primary);">$45.05</ion-text>
  </div>
  
</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 15px 5px;--border-width: 0 0;">
    
    <ion-button id="open-custom5" expand="block" style="margin-bottom: 5px;--background: var(--ion-color-txt);--color:var(--ion-color-bg)">Pay $45.05</ion-button>

    <ion-modal id="example-modal" #modal trigger="open-custom5">
      <ng-template>
        <div class="wrapper">
  
          <div class="column" style="align-items: center;">
            <ion-img src="../../../../assets/image/s14.png" style="height: 96px;width: 96px;" />
          </div>
  
          <div class="ion-text-center" style="margin: 0 10px; margin-top: 10px;">
            <ion-text class="subtitle" style="color: #FFFFFF">Your Parcel Successfully Shiped!</ion-text>
          </div>
  
          <div (click)="close1()" class="btno list" style="justify-content: baseline;margin: 0 15px;margin-top: 20px;">
            <ion-text class="b14" style="color: #ffffff;">478456147567846</ion-text>
            <ion-icon name="copy-outline" style="font-size: 16px;color: #FFFFFF;margin-left: 10px;"></ion-icon>
          </div>

          <ion-button (click)="close()" expand="block" style="margin-top: 15px;margin-bottom: 10px;--background:#ffffff;--color: #141312;">View Details</ion-button>
        </div>
      </ng-template>
    </ion-modal>
  
  </ion-toolbar>
</ion-footer>
