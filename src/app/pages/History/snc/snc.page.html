<ion-content [fullscreen]="true" [class]="darkMode?'bgd':'bg'" class="ion-padding">

  <div class="list" style="margin: 15px 0;">
    <div routerLink="/services" class="icon" style="margin-right: 10px;">
      <ion-icon name="arrow-back" style="font-size: 24px;color: var(--ion-color-bg);" />
    </div>
    <div class="input2 shadow" style="flex: 1;background-color: var(--ion-color-bg1);">
      <ion-input placeholder="Search address" style="flex: 1;" />
      <ion-icon name="mic-outline" style="font-size: 24px;" />
    </div>
  </div>

  <div class="column">
  <div class="scroll list" style="margin-top: 15px;">
    <div>
      <div class="icon" style="height: 40px;width: 40px;">
        <ion-img [src]="darkMode?'../../../../assets/image/s16d.png':'../../../../assets/image/s16.png'"
          style="height: 20px;width: 20px;" />
      </div>
    </div>
    <div>
      <div class="chip2"
        style="background-color: var(--ion-color-bg1);margin-left: 10px;border-radius: 7px;width: 110px;">
        <ion-text class="m16">Open Now</ion-text>
      </div>
    </div>
    <div>
      <div routerLink="/snc1" class="chip2"
        style="background-color: var(--ion-color-bg1);margin-left: 10px;border-radius: 7px;width: 110px;">
        <ion-text class="m16">Nearby</ion-text>
      </div>
    </div>
    <div>
      <div class="chip2"
        style="background-color: var(--ion-color-bg1);margin-left: 10px;border-radius: 7px;width: 110px;">
        <ion-text class="m16">Visited</ion-text>
      </div>
    </div>
  </div>
</div>

  <div style="position: fixed;bottom: 170px;right: 15px;">
    <div class="icon" style="background-color: var(--ion-color-primary);">
      <ion-img src="../../../../assets/image/a23.png" style="height:20px;width:20px;" />
    </div>
  </div>

</ion-content>

<div style="position: fixed;bottom: 20px;width: 100%;">
  <div class="scroll list">
  <div>
    <div class="box2 shadow" style="width: 300px;margin: 7px;background-color: var(--ion-color-bg1);">
      <div class="list">
        <div style="flex: 1;">
          <ion-text class="b16">Fast Delivery Services</ion-text>
          <div style="margin-top: 5px;">
            <ion-text class="r14" style="color: var(--ion-color-dis);">W Market Rd, Gouripur 3517</ion-text>
          </div>
        </div>
        <ion-text class="b12" style="color: #3AC479;">Open</ion-text>
      </div>
      <div class="list" style="margin-top: 15px;">
        <div class="list" style="flex: 1;">
          <div class="chip1" style="background-color: var(--ion-color-bg2);">
            <ion-text class="r10">Open : 9am - 8pm</ion-text>
          </div>
          <div class="chip1 list" style="background-color: var(--ion-color-bg2);margin-left: 10px;">
            <ion-icon name="star" style="font-size: 10px;color: #488EEB;"/>
            <ion-text class="r10" style="margin-left: 5px;">4.8</ion-text>
          </div>
        </div>
        <div class="icon" style="height: 24px;width: 24px;border-radius: 8px;">
          <ion-icon name="call" style="font-size: 10px;color: var(--ion-color-bg);"/>
        </div>
        <div class="icon" style="height: 24px;width: 24px;border-radius: 8px;margin-left: 7px;">
          <ion-icon name="paper-plane" style="font-size: 10px;color: var(--ion-color-bg);"/>
        </div>
      </div>
    </div>
  </div>
  <div>
    <div class="box2 shadow" style="width: 300px;margin: 7px;margin-left: 10px;margin-right: 25px;background-color: var(--ion-color-bg1);">
      <div class="list">
        <div style="flex: 1;">
          <ion-text class="b16">USB Express Ltd.</ion-text>
          <div style="margin-top: 5px;">
            <ion-text class="r14" style="color: var(--ion-color-dis);">W Market Rd, Gouripur 3517</ion-text>
          </div>
        </div>
        <ion-text class="b12" style="color: #3AC479;">Open</ion-text>
      </div>
      <div class="list" style="margin-top: 15px;">
        <div class="list" style="flex: 1;">
          <div class="chip1" style="background-color: var(--ion-color-bg2);">
            <ion-text class="r10">Open : 9am - 8pm</ion-text>
          </div>
          <div class="chip1 list" style="background-color: var(--ion-color-bg2);margin-left: 10px;">
            <ion-icon name="star" style="font-size: 10px;color: #488EEB;"/>
            <ion-text class="r10" style="margin-left: 5px;">4.8</ion-text>
          </div>
        </div>
        <div class="icon" style="height: 24px;width: 24px;border-radius: 8px;">
          <ion-icon name="call" style="font-size: 10px;color: var(--ion-color-bg);"/>
        </div>
        <div class="icon" style="height: 24px;width: 24px;border-radius: 8px;margin-left: 7px;">
          <ion-icon name="paper-plane" style="font-size: 10px;color: var(--ion-color-bg);"/>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
