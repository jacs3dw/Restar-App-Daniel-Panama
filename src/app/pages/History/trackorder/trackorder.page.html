<ion-header
  [translucent]="false"
  style="box-shadow: none; background-color: var(--ion-color-bg)"
>
  <ion-toolbar
    color="bg"
    style="padding: 0 15px; padding-top: 8px; --border-width: 0"
  >
    <div class="list1" style="margin: 10px 15px; margin-top: 20px">
      <ion-icon
        routerLink="/tabs/history"
        name="arrow-back"
        style="font-size: 24px; color: var(--ion-color-txt)"
      ></ion-icon>
      <ion-text class="r14">Track Order</ion-text>
      <div></div>
    </div>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true" style="background-color: var(--ion-color-bg)">
  <!-- Contenido scrollable -->
  <div
    class="page-scroll"
    style="
      padding: 0 20px 0 20px;
      box-sizing: border-box;
      max-height: 100vh;
      overflow-y: auto;
      margin-bottom: 40vh; /* Altura aprox. del bottom sheet */
    "
  >
    <!-- Imagen dinámica -->
    <img
      *ngIf="orderDetails?.imageUrl"
      [src]="orderDetails?.imageUrl"
      style="width: 100%; border-radius: 12px; margin-top: 20px"
      alt="order image"
    />

    <!-- Título dinámico -->
    <ion-text
      class="b16"
      style="display: block; margin-top: 20px; color: var(--ion-color-txt)"
    >
      {{ orderDetails?.title }}
    </ion-text>

    <!-- Link dinámico -->
    <ion-text
  class="r14"
  style="
    display: block;
    margin-top: 6px;
    word-break: break-all;
  "
>
  Link:
  <a
    [href]="orderDetails?.link"
    target="_blank"
    rel="noopener noreferrer"
    style="
      color: var(--ion-color-primary);
      text-decoration: underline;
    "
  >
    {{ orderDetails?.link }}
  </a>
</ion-text>


    <!-- Descripción dinámica -->
    <ion-text
      class="r14"
      style="
        display: block;
        margin-top: 15px;
        color: var(--ion-color-txt);
        line-height: 22px;
      "
    >
      {{ orderDetails?.description }}
    </ion-text>

    <div style="height: 12px"></div>
  </div>

  <!-- Bottom sheet fijo -->
  <div
    style="
      position: fixed;
      left: 0;
      bottom: 0;
      padding: 15px 20px;
      width: 100%;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      background-color: var(--ion-color-bg1);
      max-height: 40vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      z-index: 10;
    "
  >
    <ion-text class="r14" style="color: var(--ion-color-dis)"
      >Shipping ID</ion-text
    >
    <div style="margin-top: 5px">
      <ion-text class="b16">
        {{ trackingInfo?.shippingId || (orderDetails ? ('#' + orderDetails.id) :
        '-')}}
      </ion-text>
    </div>

    <!-- Timeline scrollable dentro del bottom sheet -->
    <div style="margin-top: 20px; flex: 1; overflow-y: auto">
      <div class="list" style="display: flex; gap: 12px">
        <!-- Columna izquierda -->
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 72px;
          "
        >
          <ng-container *ngFor="let step of trackingInfo?.steps; let i = index">
            <ion-text class="b14">{{ step.date }}</ion-text>
            <div
              [ngStyle]="{ 'margin-bottom.px': i < (trackingInfo?.steps?.length || 0) - 1 ? 15 : 0 }"
            >
              <ion-text class="r12" style="color: var(--ion-color-dis)">
                {{ step.time }}
              </ion-text>
            </div>
          </ng-container>
        </div>

        <!-- Línea central -->
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 2px;
          "
        >
          <ng-container
            *ngFor="let step of trackingInfo?.steps; let i = index; let last = last"
          >
            <div
              class="icon"
              [ngStyle]="{
              'height.px': 12,
              'width.px': 12,
              'border-radius.%': 50,
              'background-color': 
                step.status === 'current' ? '#488EEB' :
                step.status === 'done' ? '#3AC479' :
                '#9E9E9E',
              'display': 'flex',
              'align-items': 'center',
              'justify-content': 'center'
            }"
            >
              <div
                class="icon"
                [ngStyle]="{
                  'height.px': 4,
                  'width.px': 4,
                  'border-radius.%': 50,
                  'background-color':
                  step.status === 'current' ? 'var(--ion-color-bg)' :
                  step.status === 'done' ? '#FFFFFF' :
                  '#FFFFFF'

                }"
              ></div>
            </div>

            <div
              *ngIf="!last"
              [ngStyle]="{
                'border-left': (step.status !== 'pending' && trackingInfo && trackingInfo.steps[i + 1] && trackingInfo.steps[i + 1].status !== 'pending')
                  ? '3px solid #488EEB'
                  : '3px solid var(--ion-color-search)',
                'height.px': 50,
                'margin-left.px': 0
              }"
            ></div>
          </ng-container>
        </div>

        <!-- Columna derecha -->
        <div style="flex: 1; display: flex; flex-direction: column">
          <ng-container *ngFor="let step of trackingInfo?.steps; let i = index">
            <ion-text class="b16">{{ step.title }}</ion-text>
            <div
              [ngStyle]="{ 'margin-bottom.px': i < (trackingInfo?.steps?.length || 0) - 1 ? 15 : 0 }"
            >
              <ion-text class="r12" style="color: var(--ion-color-dis)">
                {{ step.address }}
              </ion-text>
            </div>
          </ng-container>
        </div>
      </div>
    </div>

    <ion-button
      routerLink="/tabs/history"
      expand="block"
      style="
        margin: 20px 0 0 0;
        --background: var(--ion-color-txt);
        --color: var(--ion-color-bg);
      "
    >
      Go To Back
    </ion-button>
  </div>
</ion-content>
