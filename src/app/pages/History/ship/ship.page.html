<ion-header [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 0px 15px;padding-top: 8px;--border-width: 0 0;">
    <ion-buttons slot="start" routerLink="/ssp">
      <ion-icon name="arrow-back-outline" style="font-size: 24px;" color="txt"></ion-icon>
    </ion-buttons>
    <div class="ion-text-center" >
      <ion-text class="r14">Ship Parcel </ion-text>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" color="bg">

  <div class="input2 shadow" style="background-color: var(--ion-color-bg1);">
    <ion-input type="text" placeholder="24 Jun, 16:32" style="flex:1"></ion-input>
    <ion-icon name="calendar-outline" style="font-size: 20px;" color="txt"></ion-icon>
  </div>

  <div class="input2 shadow" style="margin-top: 15px;background-color: var(--ion-color-bg1);">
    <ion-input type="text" placeholder="Internal Reference ID" style="flex:1"></ion-input>
  </div>

  <div class="input2 shadow" style="margin-top: 15px;background-color: var(--ion-color-bg1);height: 100px;align-items: flex-start;">
    <ion-textarea type="text" placeholder="Item Name & Description" style="flex:1"></ion-textarea>
  </div>

  <div class="box list1 shadow" style="margin-top: 15px;background-color: var(--ion-color-bg1);">
    <ion-text class="m16">More Pickup Details</ion-text>
    <ion-img src="../../../../assets/image/a2.png" style="height: 20px;width: 20px;"></ion-img>
  </div>
  
  <div class="list" style="margin-top: 25px;">
    <ion-img [src]="darkMode ? '../../../../assets/image/a20d.png' : '../../../../assets/image/a20.png' " style="height: 20px;width: 20px;"></ion-img>
    <ion-text class="r14" style="margin-left: 15px;flex:1">Extra Cover for Damage</ion-text>
    <ion-text class="b16">$3.00</ion-text>
  </div>

  <div class="list" style="margin-top: 20px;">
    <ion-img src="../../../../assets/image/a21.png" style="height: 20px;width: 20px;"></ion-img>
    <ion-text class="r14" style="margin-left: 15px;flex:1">Home Delivery</ion-text>
    <ion-text class="b16">$3.00</ion-text>
  </div>

  <div class="lines" style="border-color: var(--ion-color-input);margin: 20px 0px;"></div>

  <div class="list1" >
    <div class="column" style="align-items: flex-start;">
      <ion-text class="b16" >Wed, Oct 16</ion-text>
      <ion-text class="r14" style="color: var(--ion-color-dis);line-height: 24px;">Arives On</ion-text>
    </div>

    <ion-img [src]="darkMode ? '../../../../assets/image/appicond.png' : '../../../../assets/image/appicon.png' " style="height: 29px;width: 24px;"></ion-img>

    <div class="column" style="align-items: flex-end;">
      <ion-text class="b16" >5.00 pm</ion-text>
      <ion-text class="r14" style="color: var(--ion-color-dis);line-height: 24px;">Delivered By</ion-text>
    </div>
  </div>

</ion-content>

<ion-footer [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 15px 5px;--border-width: 0 0;">
    
    <ion-button routerLink="/payment" expand="block" style="margin-bottom: 5px;--background: var(--ion-color-txt);--color:var(--ion-color-bg)">Ship</ion-button>

  </ion-toolbar>
</ion-footer>
