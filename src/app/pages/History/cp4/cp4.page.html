<ion-header [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 0 15px;padding-top: 20px;--border-width: 0;">
    <ion-buttons slot="start" routerLink="/tabs/home">
      <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
    </ion-buttons>
    <ion-title class="r14" style="text-align: center;">Compare Price</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <!-- 🔹 Opciones dinámicas -->
  <div
    class="box2 shadow"
    *ngFor="let option of shippingOptions; let i = index; let last = last"
    [ngStyle]="{
      'background-color': 'var(--ion-color-bg1)',
      'margin-top.px': i === 0 ? 0 : 15
    }"
  >
    <div class="list">
      <div class="list">
        <div style="flex: 1;">
          <!-- Nombre en blanco arriba -->
          <ion-text class="b16" style="color: #FFFFFF; margin-bottom: 7px; font-size: 15px;">
            {{ option.name }}
          </ion-text>
  
          <!-- URL abajo en azul tipo enlace -->
          <div style="margin-top: 4px;">
            <ion-text
  class="r10"
  style="
    color: #488EEB;
    text-decoration: underline;
    cursor: pointer;
    font-size: 12px;
    display: block;
    max-width: 100%;
    white-space: normal;
    word-break: break-all;
  "
>
  {{ option.url }}
</ion-text>

          </div>
        </div>
      </div>
  
      
      <ion-text
    class="b16"
    style="margin-left: auto; white-space: nowrap;"
  >
        $ <ion-text class="apptitle" style="color: #488EEB;">
          {{ option.price | number:'1.2-2' }}
        </ion-text>
      </ion-text>
    </div>

    <div class="list" style="margin-top: 18px;">
      <div class="list" style="flex: 1;">
        <!-- <div class="chip1 list" style="background-color: var(--ion-color-bg2);">
          <ion-icon name="star" style="font-size: 10px;color: #488EEB;"></ion-icon>
          <ion-text class="r10" style="margin-left: 5px;">
            {{ option.rating }}
          </ion-text>
        </div> -->

        <!-- <div
          class="chip1"
          *ngIf="option.hasTracking"
          style="background-color: var(--ion-color-bg2);margin-left: 10px;"
        >
          <ion-text class="r10">Tracking</ion-text>
        </div> -->
      </div>

   <div
  class="icon"
  (click)="removeItem(option.id)"
  style="
  min-width: 100px;
  min-height: 25px;
    padding: 1px 10px;
    border-radius: 6px;
    background-color: #ffffff;
    border: 1px solid var(--ion-color-dis);
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    height: auto;
    cursor: pointer;
  "
>
  <ion-text style="color: #000000; font-size: 12px; white-space: nowrap;">
    Do not buy
  </ion-text>
</div>




    </div>
  </div>

  <!-- 🔹 Botón usando la opción recomendada -->
  <ion-button
    routerLink="/payment"
    expand="block"
    style="margin-top: 40px;--background: var(--ion-color-txt);--color: var(--ion-color-bg); padding: 0px;"
  >
    Continue with the order
  </ion-button>

  <div routerLink="/tabs/home" class="btno" style="margin-bottom: 15px;">
    <ion-text class="b14">Back to Home</ion-text>
  </div>

</ion-content>
