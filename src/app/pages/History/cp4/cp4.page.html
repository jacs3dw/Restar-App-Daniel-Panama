<ion-header [translucent]="false" style="box-shadow: none;background-color: var(--ion-color-bg);">
  <ion-toolbar color="bg" style="padding: 0 15px;padding-top: 20px;--border-width: 0;">
    <ion-buttons slot="start" routerLink="/cp3">
      <ion-icon name="chevron-back" style="font-size: 24px;color: var(--ion-color-txt);" />
    </ion-buttons>
    <ion-title class="r14" style="text-align: center;">Compare Price</ion-title>
  </ion-toolbar>
  <div class="list" style="margin: 10px 15px;">
    <div class="input2 shadow" style="flex: 1;background-color: var(--ion-color-bg1);">  
      <ion-input placeholder="Search address" style="margin-left: 10px;flex: 1;"/>
      <ion-icon name="mic-outline"/>
    </div>
    <div class="icon" style="margin-left: 10px;">
      <ion-img [src]="darkMode?'../../../../assets/image/s16d.png':'../../../../assets/image/s16.png'"
          style="height: 20px;width: 20px;" />
    </div>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <div class="box2 shadow" style="background-color: var(--ion-color-bg1);">
    <div class="list">
      <div style="flex: 1;">
        <ion-text class="b16">Fast Delivery Services</ion-text>
        <div >
          <ion-text class="r10" style="color: var(--ion-color-dis);">Delivery : <ion-text class="r10">8 - 10 Working Days</ion-text></ion-text>
        </div>
      </div>
      <ion-text class="b16">$ <ion-text class="apptitle" style="color: var(--ion-color-primary);"> 48.00</ion-text></ion-text>
    </div>
    <div class="list" style="margin-top: 18px;">
      <div class="list" style="flex: 1;">
        <div class="chip1 list" style="background-color: var(--ion-color-bg2);">
          <ion-icon name="star" style="font-size: 10px;color: #F95A54;"/>
          <ion-text class="r10" style="margin-left: 5px;">4.8</ion-text>
        </div>
        <div class="chip1" style="background-color: var(--ion-color-bg2);margin-left: 10px;">
          <ion-text class="r10">Tracking</ion-text>
        </div>
      </div>
      <div class="icon" style="height: 24px;width: 24px;border-radius: 8px;">
        <ion-icon name="call" style="font-size: 10px;color: var(--ion-color-bg);"/>
      </div>
      <div class="icon" style="height: 24px;width: 24px;border-radius: 8px;margin-left: 7px;">
        <ion-icon name="paper-plane" style="font-size: 10px;color: var(--ion-color-bg);"/>
      </div>
    </div>
  </div>

  <div class="box2 shadow" style="background-color: var(--ion-color-bg1);margin-top: 15px;">
    <div class="list">
      <div style="flex: 1;">
        <ion-text class="b16">USB Express Ltd.</ion-text>
        <div >
          <ion-text class="r10" style="color: var(--ion-color-dis);">Delivery : <ion-text class="r10">8 - 10 Working Days</ion-text></ion-text>
        </div>
      </div>
      <ion-text class="b16">$ <ion-text class="apptitle" style="color: var(--ion-color-primary);"> 64.00</ion-text></ion-text>
    </div>
    <div class="list" style="margin-top: 18px;">
      <div class="list" style="flex: 1;">
        <div class="chip1 list" style="background-color: var(--ion-color-bg2);">
          <ion-icon name="star" style="font-size: 10px;color: #F95A54;"/>
          <ion-text class="r10" style="margin-left: 5px;">4.8</ion-text>
        </div>
        <div class="chip1" style="background-color: var(--ion-color-bg2);margin-left: 10px;">
          <ion-text class="r10">Tracking</ion-text>
        </div>
      </div>
      <div class="icon" style="height: 24px;width: 24px;border-radius: 8px;">
        <ion-icon name="call" style="font-size: 10px;color: var(--ion-color-bg);"/>
      </div>
      <div class="icon" style="height: 24px;width: 24px;border-radius: 8px;margin-left: 7px;">
        <ion-icon name="paper-plane" style="font-size: 10px;color: var(--ion-color-bg);"/>
      </div>
    </div>
  </div>

  <div class="box2 shadow" style="background-color: var(--ion-color-bg1);margin-top: 15px;">
    <div class="list">
      <div style="flex: 1;">
        <ion-text class="b16">Fox Parcel</ion-text>
        <div >
          <ion-text class="r10" style="color: var(--ion-color-dis);">Delivery : <ion-text class="r10">8 - 10 Working Days</ion-text></ion-text>
        </div>
      </div>
      <ion-text class="b16">$ <ion-text class="apptitle" style="color: var(--ion-color-primary);"> 60.00</ion-text></ion-text>
    </div>
    <div class="list" style="margin-top: 18px;">
      <div class="list" style="flex: 1;">
        <div class="chip1 list" style="background-color: var(--ion-color-bg2);">
          <ion-icon name="star" style="font-size: 10px;color: #F95A54;"/>
          <ion-text class="r10" style="margin-left: 5px;">4.8</ion-text>
        </div>
        <div class="chip1" style="background-color: var(--ion-color-bg2);margin-left: 10px;">
          <ion-text class="r10">Tracking</ion-text>
        </div>
      </div>
      <div class="icon" style="height: 24px;width: 24px;border-radius: 8px;">
        <ion-icon name="call" style="font-size: 10px;color: var(--ion-color-bg);"/>
      </div>
      <div class="icon" style="height: 24px;width: 24px;border-radius: 8px;margin-left: 7px;">
        <ion-icon name="paper-plane" style="font-size: 10px;color: var(--ion-color-bg);"/>
      </div>
    </div>
  </div>

  <ion-button routerLink="/services" expand="block" style="margin: 20px 0;margin-top: 40px;--background: var(--ion-color-txt);--color: var(--ion-color-bg);">Continue with Fast</ion-button>
  <div routerLink="/tabs/history" class="btno" style="margin-bottom: 15px;">
    <ion-text class="b14">Back to Home</ion-text>
  </div>

</ion-content>
