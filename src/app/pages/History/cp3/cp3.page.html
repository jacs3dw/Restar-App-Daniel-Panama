
<ion-content [fullscreen]="true" [class]="darkMode?'bgd':'bg'">
  
  <div class="list1" style="margin: 10px 15px;margin-top: 20px;">
    <ion-icon routerLink="/cp2" name="arrow-back" style="font-size: 24px;color: var(--ion-color-txt);" />
    <ion-text class="r14">Calculate Result</ion-text>
    <div></div>
  </div>

  <div style="position: fixed;bottom: 0;padding: 15px;width: 100%;border-top-left-radius: 20px;border-top-right-radius: 20px;background-color: var(--ion-color-bg1);">
    
    <ion-text class="subtitle" >Suggestion</ion-text>

    <div class="box shadow list" style="margin-top: 15px;">
      <ion-img src="../../../../assets/image/s6.png" style="height:81px;width:85px;" />
      <div style="margin-left: 10px;flex: 1;">
        <ion-text class="b16">Small</ion-text>
        <div style="margin-top: 10px;margin-bottom: 3px;">
          <ion-text class="r14" style="color: var(--ion-color-dis);">Max. Weight</ion-text>
        </div>
        <ion-text class="b16">0-5 kg</ion-text>
      </div>
      <div style="flex: 1;">
        <ion-text class="b16">$ <ion-text class="apptitle" style="color: var(--ion-color-primary);"> 48.00</ion-text></ion-text>
        <div style="margin-top: 10px;margin-bottom: 3px;">
          <ion-text class="r14" style="color: var(--ion-color-dis);">Max. Length</ion-text>
        </div>
        <ion-text class="b16">33 cm</ion-text>
      </div>
    </div>

    <ion-button routerLink="/cp4" expand="block" style="margin: 20px 0;--background: var(--ion-color-txt);--color: var(--ion-color-bg);">Compare Price</ion-button>


    <div routerLink="/tabs/history" class="btno" style="margin-bottom: 15px;">
      <ion-text class="b14">Back to Home</ion-text>
    </div>
    
  </div>

</ion-content>
